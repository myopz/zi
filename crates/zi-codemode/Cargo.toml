[package]
name = "zi-codemode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "QuickJS codemode host for zi"

[features]
default = []
quickjs = ["dep:rquickjs"]

[dependencies]
zi-agent = { path = "../zi-agent" }
async-trait = "0.1.88"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
rquickjs = { version = "0.8", optional = true, default-features = false, features = ["macro"] }
