[package]
name = "zi-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP client (stdio + streamable HTTP) for zi"

[features]
default = []
# OAuth discovery, callback, and token refresh — Phase 5+ (see src/oauth).
oauth = []

[dependencies]
bytes = "1.10.1"
async-trait = "0.1.88"
futures = "0.3.31"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.44.2", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

# Optional: `rmcp` could wrap the official SDK later; this crate stays a thin client aligned with pi `McpClient`.
