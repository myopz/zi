[package]
name = "zi-env"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Remote execution env daemon (zi-envd) and clients for zi"

[[bin]]
name = "zi-envd"
path = "src/bin/envd.rs"

[dependencies]
zi-durable = { path = "../zi-durable" }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
