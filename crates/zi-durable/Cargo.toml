[package]
name = "zi-durable"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Durable harness for zi (Phase 8 skeleton)"

[features]
default = []
codemode = ["dep:zi-codemode"]
sqlite = ["dep:rusqlite", "zi-chord/sqlite"]

[dependencies]
zi-ai = { path = "../zi-ai" }
zi-chord = { path = "../zi-chord" }
zi-codemode = { path = "../zi-codemode", optional = true }
zi-telemetry = { path = "../zi-telemetry" }
rusqlite = { version = "0.34.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
uuid = { workspace = true }
